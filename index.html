<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Noyau" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Noyau</title>
    <style>.preboot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1b2719 0,#0a0d0c 38%);color:#e8ede9;font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.preboot span{display:grid;justify-items:center;gap:14px}.preboot i{width:38px;height:38px;border:2px solid #b8ff5e;border-radius:50%;box-shadow:0 0 20px #b8ff5e33}.preboot small{color:#78817b;font-size:9px;font-weight:400}.preboot i{animation:preboot-spin 1.1s linear infinite;border-top-color:transparent}@keyframes preboot-spin{to{transform:rotate(360deg)}}.preboot-note{max-width:260px;text-align:center;line-height:1.5}.preboot-actions{display:flex;gap:8px;margin-top:4px}.preboot-actions button{font:600 12px inherit;padding:8px 14px;border-radius:8px;border:1px solid #2c332e;background:#141a16;color:#e8ede9}.preboot-actions button.danger{border-color:#5a2a2a;color:#ff9b9b}</style>
  </head>
  <body>
    <div id="root"><div class="preboot"><span><i></i>Noyau<small>Démarrage…</small></span></div></div>
    <script src="/boot-fallback.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
